name: CosmicHammer

options:
  bundleIdPrefix: org.cosmic-hammer
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "1600"

configs:
  Debug: debug
  Profile: debug
  Release: release

settings:
  configFiles:
    Debug: CosmicHammer/Build Configs/Project-Base.xcconfig
    Profile: CosmicHammer/Build Configs/Project-Base.xcconfig
    Release: CosmicHammer/Build Configs/Project-Base.xcconfig
  configs:
    Release:
      GCC_OPTIMIZATION_LEVEL: s

# Single unified SPM package containing LuaSkin, CocoaHTTPServer, and
# HSExtensions as internal targets. Remote dependencies (CocoaLumberjack,
# CocoaAsyncSocket, ORSSerialPort) are resolved transitively.
packages:
  CosmicHammerLibs:
    path: Packages

targets:
  CosmicHammer:
    type: application
    platform: macOS
    configFiles:
      Debug: CosmicHammer/Build Configs/CosmicHammer-Base.xcconfig
      Profile: CosmicHammer/Build Configs/CosmicHammer-Profile.xcconfig
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        ENABLE_DEBUG_DYLIB: "NO"
      configs:
        Release:
          GCC_OPTIMIZATION_LEVEL: s
    sources:
      # Entry point for the Xcode app target (SPM uses HSApp/main.swift instead)
      - path: Xcode/main.swift
      # Resources from CosmicHammer/ (exclude code — compiled by SPM via HSExtensions)
      - path: CosmicHammer
        excludes: ["**/*.m", "**/*.h", "**/*.swift", "**/*.pch", Build Configs, CosmicHammer-Info.plist, "*.entitlements"]
        buildPhase: resources
      # Resources from outside CosmicHammer/
      - path: extensions/doc/lua.json
        buildPhase: resources
      - path: extensions/httpserver/timeout3
        buildPhase: resources
      - path: build/docs.json
        buildPhase: resources
        optional: true
      # Copy hs manpage -> Resources/man/
      - path: extensions/ipc/cli/hs.man
        buildPhase:
          copyFiles: { destination: resources, subpath: man }
      # Copy hsdocs -> Resources/extensions/hs/hsdocs/
      - path: extensions/doc/hsdocs
        excludes: [hsminweb]
        buildPhase:
          copyFiles: { destination: resources, subpath: extensions/hs/hsdocs }
      - path: scripts/docs/templates/docs.css
        buildPhase:
          copyFiles: { destination: resources, subpath: extensions/hs/hsdocs }
      # Copy hsdocs/hsminweb -> Resources/extensions/hs/hsdocs/hsminweb/
      - path: extensions/doc/hsdocs/hsminweb
        buildPhase:
          copyFiles: { destination: resources, subpath: extensions/hs/hsdocs/hsminweb }
    dependencies:
      - package: CosmicHammerLibs

  CosmicHammer UI Tests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: CosmicHammerUITests
    dependencies:
      - target: CosmicHammer
    settings:
      base:
        TEST_TARGET_NAME: CosmicHammer
        INFOPLIST_FILE: CosmicHammerUITests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.cosmic-hammer.CosmicHammerUITests
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/../Frameworks"]

schemes:
  CosmicHammer:
    build:
      targets:
        CosmicHammer: all
    run:
      config: Debug
      enableAddressSanitizer: true
      enableASanStackUseAfterReturn: true
      enableUBSanitizer: true
      commandLineArguments:
        "-NSConstraintBasedLayoutVisualizeMutuallyExclusiveConstraints YES": true
      environmentVariables:
        - variable: NSZombieEnabled
          value: "YES"
          isEnabled: true
        - variable: MallocScribble
          value: ""
          isEnabled: true
    test:
      config: Debug
      gatherCoverageData: true
      enableAddressSanitizer: true
      enableASanStackUseAfterReturn: true
      enableUBSanitizer: true
      environmentVariables:
        - variable: NSZombieEnabled
          value: "YES"
          isEnabled: true
        - variable: MallocScribble
          value: ""
          isEnabled: true
      targets: []
    profile:
      config: Profile
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true

  Release:
    build:
      targets:
        CosmicHammer: all
    run:
      config: Release
      disableMainThreadChecker: true
      enableGPUValidationMode: true
    test:
      config: Debug
      gatherCoverageData: true
      enableAddressSanitizer: true
      enableASanStackUseAfterReturn: true
      enableUBSanitizer: true
      environmentVariables:
        - variable: NSZombieEnabled
          value: "YES"
          isEnabled: true
        - variable: MallocScribble
          value: ""
          isEnabled: true
      targets:
        - name: CosmicHammer UI Tests
          skipped: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
