name: Hammerspoon

options:
  bundleIdPrefix: org.hammerspoon
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "1600"

configs:
  Debug: debug
  Profile: debug
  Release: release

settings:
  configFiles:
    Debug: Hammerspoon/Build Configs/Project-Base.xcconfig
    Profile: Hammerspoon/Build Configs/Project-Base.xcconfig
    Release: Hammerspoon/Build Configs/Project-Base.xcconfig
  configs:
    Release:
      GCC_OPTIMIZATION_LEVEL: s

# Single unified SPM package containing LuaSkin, CocoaHTTPServer, and
# HSExtensions as internal targets. Remote dependencies (CocoaLumberjack,
# CocoaAsyncSocket, ORSSerialPort) are resolved transitively.
packages:
  HammerspoonLibs:
    path: Packages

targets:
  Hammerspoon:
    type: application
    platform: macOS
    configFiles:
      Debug: Hammerspoon/Build Configs/Hammerspoon-Base.xcconfig
      Profile: Hammerspoon/Build Configs/Hammerspoon-Profile.xcconfig
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        ENABLE_DEBUG_DYLIB: "NO"
      configs:
        Release:
          GCC_OPTIMIZATION_LEVEL: s
    sources:
      # Entry point for the Xcode app target (SPM uses HSApp/main.swift instead)
      - path: Xcode/main.m
      # Resources from Hammerspoon/ (exclude code — compiled by SPM via HSExtensions)
      - path: Hammerspoon
        excludes: ["**/*.m", "**/*.h", "**/*.swift", "**/*.pch", Build Configs, Hammerspoon-Info.plist, "*.entitlements"]
        buildPhase: resources
      # Resources from outside Hammerspoon/
      - path: extensions/doc/lua.json
        buildPhase: resources
      - path: extensions/httpserver/timeout3
        buildPhase: resources
      - path: build/docs.json
        buildPhase: resources
        optional: true
      # Copy hs manpage -> Resources/man/
      - path: extensions/ipc/cli/hs.man
        buildPhase:
          copyFiles: { destination: resources, subpath: man }
      # Copy hsdocs -> Resources/extensions/hs/hsdocs/
      - path: extensions/doc/hsdocs
        excludes: [hsminweb]
        buildPhase:
          copyFiles: { destination: resources, subpath: extensions/hs/hsdocs }
      - path: scripts/docs/templates/docs.css
        buildPhase:
          copyFiles: { destination: resources, subpath: extensions/hs/hsdocs }
      # Copy hsdocs/hsminweb -> Resources/extensions/hs/hsdocs/hsminweb/
      - path: extensions/doc/hsdocs/hsminweb
        buildPhase:
          copyFiles: { destination: resources, subpath: extensions/hs/hsdocs/hsminweb }
    dependencies:
      - package: HammerspoonLibs

  Hammerspoon Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Hammerspoon Tests
      - path: extensions
        includes: ["**/test_*.lua"]
        buildPhase: resources
    dependencies:
      - target: Hammerspoon
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hammerspoon.app/Contents/MacOS/Hammerspoon"
        INFOPLIST_FILE: "Hammerspoon Tests/Info.plist"
        PRODUCT_BUNDLE_IDENTIFIER: "org.hammerspoon.$(PRODUCT_NAME:rfc1034identifier)"
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/../Frameworks"]
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Hammerspoon", "$(inherited)"]
        WARNING_CFLAGS: ["-Wno-cstring-format-directive", "-Wno-padded", "-Wno-objc-missing-property-synthesis", "-Wno-gnu-statement-expression"]
        FRAMEWORK_SEARCH_PATHS: ["$(DEVELOPER_FRAMEWORKS_DIR)", "$(SDKROOT)/System/Library/PrivateFrameworks", "$(inherited)"]
        GCC_PREPROCESSOR_DEFINITIONS: ["DEBUG=1", "$(inherited)"]

  Hammerspoon UI Tests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: HammerspoonUITests
    dependencies:
      - target: Hammerspoon
    settings:
      base:
        TEST_TARGET_NAME: Hammerspoon
        INFOPLIST_FILE: HammerspoonUITests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.hammerspoon.HammerspoonUITests
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/../Frameworks"]

schemes:
  Hammerspoon:
    build:
      targets:
        Hammerspoon: all
        Hammerspoon Tests: [testing, profiling, analyzing]
    run:
      config: Debug
      enableAddressSanitizer: true
      enableASanStackUseAfterReturn: true
      enableUBSanitizer: true
      commandLineArguments:
        "-NSConstraintBasedLayoutVisualizeMutuallyExclusiveConstraints YES": true
      environmentVariables:
        - variable: NSZombieEnabled
          value: "YES"
          isEnabled: true
        - variable: MallocScribble
          value: ""
          isEnabled: true
    test:
      config: Debug
      gatherCoverageData: true
      enableAddressSanitizer: true
      enableASanStackUseAfterReturn: true
      enableUBSanitizer: true
      environmentVariables:
        - variable: NSZombieEnabled
          value: "YES"
          isEnabled: true
        - variable: MallocScribble
          value: ""
          isEnabled: true
      targets:
        - name: Hammerspoon Tests
          randomExecutionOrder: true
          location: "London, England"
    profile:
      config: Profile
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true

  Release:
    build:
      targets:
        Hammerspoon: all
        Hammerspoon Tests: [testing]
    run:
      config: Release
      disableMainThreadChecker: true
      enableGPUValidationMode: true
    test:
      config: Debug
      gatherCoverageData: true
      enableAddressSanitizer: true
      enableASanStackUseAfterReturn: true
      enableUBSanitizer: true
      environmentVariables:
        - variable: NSZombieEnabled
          value: "YES"
          isEnabled: true
        - variable: MallocScribble
          value: ""
          isEnabled: true
      targets:
        - name: Hammerspoon Tests
          randomExecutionOrder: true
        - name: Hammerspoon UI Tests
          skipped: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
